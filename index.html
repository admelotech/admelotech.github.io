<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admelotech — Digital Services</title>
  <meta name="description" content="Admelotech — digital services studio. Coming soon." />
  <meta name="theme-color" content="#000000" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Arial Narrow', Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }
    header, footer {
      padding: 20px;
      border-color: rgba(255,255,255,0.1);
      border-style: solid;
    }
    header {
      border-bottom-width: 1px;
    }
    footer {
      border-top-width: 1px;
    }
    .brand {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coming-soon {
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .socials {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 14px;
    }
    a {
      color: #fff;
      text-decoration: none;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Admelotech</div>
  </header>

  <main>
    <div class="coming-soon">Digital Services Coming Soon</div>
  </main>

  <footer>
    <div class="socials">
      <a href="https://instagram.com/admelotech" target="_blank" rel="noopener">Instagram: @admelotech</a>
      <a href="mailto:admelotech@gmail.com">Email: admelotech@gmail.com</a>
    </div>
  </footer>
</body>
</html>
